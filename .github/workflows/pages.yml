name: Test and deploy Signal Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-lab-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify modem and repetition protocol
        run: |
          node tests/codec.test.mjs
          node tests/transfers.test.mjs
          node tests/locations.test.mjs
          node tests/capture.test.mjs
          node tests/acoustic.test.mjs
          node tests/acquisition.test.mjs
          node tests/session.test.mjs
          node tests/monitor.test.mjs
          node tests/morse.test.mjs
          node tests/signal-plan.test.mjs
          node tests/custom-stream.test.mjs
          node tests/eas-study.test.mjs
          node --check dist/app.mjs
          node --check dist/receive-worker.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify browser workflows
        run: python tests/browser/test_workflows.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy HTTPS app
        id: deployment
        uses: actions/deploy-pages@v4
